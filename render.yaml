      - key: UPSTASH_REST_TOKEN
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://maatfeed-git-staging-franck-s-projects-8e4e5822.vercel.app,https://maatfeed-jj356d2e7-franck-s-projects-8e4e5822.vercel.app,https://maatfeed.vercel.app
      - key: CORS_CREDENTIALS
        value: true
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_CHANNEL_IDS
        sync: false
      - key: TIKTOK_PROVIDER_BASE_URL
        value: https://api.apify.com/v2/acts/clockworks~tiktok-scraper/run-sync-get-dataset-items
      - key: APIFY_API_TOKEN
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: HUGGINGFACE_INFERENCE_BASE_URL
        value: https://router.huggingface.co/hf-inference/models
      - key: HUGGINGFACE_CLASSIFIER_MODEL
        value: facebook/bart-large-mnli
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: "Maatfeed <no-reply@maatfeed.com>"
      - key: APP_BASE_URL
        value: https://maatfeed-git-staging-franck-s-projects-8e4e5822.vercel.app
      - key: API_BASE_URL
        value: https://maat-api-staging.onrender.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: PAYMENT_PROVIDER
        value: paystack
      - key: PAYMENT_SUCCESS_URL
        value: https://maatfeed-git-staging-franck-s-projects-8e4e5822.vercel.app/profile
      - key: PAYMENT_CANCEL_URL
        value: https://maatfeed-git-staging-franck-s-projects-8e4e5822.vercel.app/profile
      - key: SESSION_SECRET
        generateValue: true
      - key: HELMET_ENABLED
        value: true
    healthCheckPath: /api/health
    autoDeploy: false

  # Worker Service (Staging)
  - type: worker
    name: maat-worker-staging
    runtime: node
    plan: starter
    branch: staging
    rootDir: .
    buildCommand: npm ci --include=dev --legacy-peer-deps && npm run build:shared && npm --workspace @maat/api run build
    startCommand: npm --workspace @maat/api run worker:prod
    envVars:
      - key: NODE_ENV
        value: staging
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: maat-redis-staging
          property: connectionString
      - key: UPSTASH_REST_TOKEN
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_CHANNEL_IDS
        sync: false
      - key: WORKER_AUTO_INGEST_CRON
        value: "0 */2 * * *"
      - key: WORKER_AUTO_INGEST_LIMIT_PER_PROVIDER
        value: 10
      - key: WORKER_AUTO_INGEST_CHANNEL_LIMIT_PER_CHANNEL
        value: 6
      - key: APIFY_API_TOKEN
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
    autoDeploy: false
