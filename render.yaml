# Render Blueprint for MAAT FEED API
# Deploy to Render: https://render.com/deploy?repo=https://github.com/kyfran225/maatfeed

services:
  # API Production Service
  - type: keyvalue
    name: maat-redis-production
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: maat-api-production
    runtime: node
    plan: starter
    branch: main
    rootDir: .
    buildCommand: npm ci --include=dev --legacy-peer-deps && npm run build:shared && npm --workspace @maat/api run build
    startCommand: npm --workspace @maat/api run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: maat-redis-production
          property: connectionString
      - key: UPSTASH_REST_TOKEN
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://www.maatfeed.com,https://maatfeed.vercel.app
      - key: CORS_CREDENTIALS
        value: true
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_CHANNEL_IDS
        sync: false
      - key: TIKTOK_PROVIDER_BASE_URL
        value: https://api.apify.com/v2/acts/clockworks~tiktok-scraper/run-sync-get-dataset-items
      - key: APIFY_API_TOKEN
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: HUGGINGFACE_INFERENCE_BASE_URL
        value: https://router.huggingface.co/hf-inference/models
      - key: HUGGINGFACE_CLASSIFIER_MODEL
        value: facebook/bart-large-mnli
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: "Maatfeed <no-reply@maatfeed.com>"
      - key: APP_BASE_URL
        value: https://www.maatfeed.com
      - key: API_BASE_URL
        value: https://api.maatfeed.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: PAYMENT_PROVIDER
        value: paystack
      - key: PAYMENT_SUCCESS_URL
        value: https://www.maatfeed.com/profile
      - key: PAYMENT_CANCEL_URL
        value: https://www.maatfeed.com/profile
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:noreply@maatfeed.com
      - key: SESSION_SECRET
        generateValue: true
      - key: HELMET_ENABLED
        value: true
      - key: LOG_LEVEL
        value: info
      - key: CACHE_TTL_GLOBAL
        value: 600
      - key: CACHE_TTL_USER
        value: 300
      - key: CACHE_TTL_SESSION
        value: 900
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
    healthCheckPath: /api/health
    autoDeploy: false
    domains:
      - api.maatfeed.com

  # Worker Service (Production)
  - type: worker
    name: maat-worker-production
    runtime: node
    plan: starter
    branch: main
    rootDir: .
    buildCommand: npm ci --include=dev --legacy-peer-deps && npm run build:shared && npm --workspace @maat/api run build
    startCommand: npm --workspace @maat/api run worker:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: maat-redis-production
          property: connectionString
      - key: UPSTASH_REST_TOKEN
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: WORKER_INGEST_CONCURRENCY
        value: 1
      - key: WORKER_CLASSIFY_CONCURRENCY
        value: 1
      - key: WORKER_CLASSIFY_RATE_LIMIT_PER_MINUTE
        value: 15
      - key: WORKER_ENRICH_CONCURRENCY
        value: 1
      - key: WORKER_ENRICH_RATE_LIMIT_PER_MINUTE
        value: 15
      - key: WORKER_COMMUNITY_AI_CONCURRENCY
        value: 1
      - key: WORKER_COMMUNITY_AI_RATE_LIMIT_PER_MINUTE
        value: 10
      - key: WORKER_MULTI_AI_CONCURRENCY
        value: 1
      - key: WORKER_MULTI_AI_RATE_LIMIT_PER_MINUTE
        value: 6
      - key: WORKER_AUTO_INGEST_CRON
        value: "0 */3 * * *"
      - key: WORKER_AUTO_INGEST_LIMIT_PER_PROVIDER
        value: 8
      - key: WORKER_AUTO_INGEST_CHANNEL_LIMIT_PER_CHANNEL
        value: 6
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_CHANNEL_IDS
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
    autoDeploy: false

  # API Staging Service
  - type: keyvalue
    name: maat-redis-staging
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: maat-api-staging
    runtime: node
    plan: starter
    branch: staging
    rootDir: .
    buildCommand: npm ci --include=dev --legacy-peer-deps && npm run build:shared && npm --workspace @maat/api run build
