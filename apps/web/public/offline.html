<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MAATFEED - Hors ligne</title>
  <meta name="theme-color" content="#0B0704">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
      background: #0B0704;
      color: #F5F5F5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    
    .container {
      max-width: 480px;
      width: 100%;
    }
    
    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 32px;
      background: linear-gradient(135deg, #D4AF37 0%, #B8941F 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      color: #0B0704;
    }
    
    .icon {
      font-size: 64px;
      margin-bottom: 24px;
      opacity: 0.9;
    }
    
    h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 16px;
      line-height: 1.3;
    }
    
    p {
      font-size: 16px;
      line-height: 1.6;
      color: #A3A3A3;
      margin-bottom: 32px;
    }
    
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #D4AF37 0%, #B8941F 100%);
      color: #0B0704;
      border: none;
      padding: 16px 32px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      min-width: 200px;
    }
    
    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(212, 175, 55, 0.3);
    }
    
    .button:active {
      transform: translateY(0);
    }
    
    .button-secondary {
      background: transparent;
      border: 1px solid #3A3A3A;
      color: #A3A3A3;
      margin-top: 12px;
    }
    
    .button-secondary:hover {
      border-color: #D4AF37;
      color: #D4AF37;
      box-shadow: none;
    }
    
    .status {
      margin-top: 40px;
      padding: 16px;
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 12px;
      font-size: 14px;
      color: #D4AF37;
    }
    
    .status.hidden {
      display: none;
    }
    
    .cached-content {
      margin-top: 40px;
      text-align: left;
    }
    
    .cached-content h2 {
      font-size: 18px;
      margin-bottom: 16px;
      color: #F5F5F5;
    }
    
    .cached-list {
      list-style: none;
    }
    
    .cached-list li {
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
    }
    
    .cached-list li::before {
      content: '✓';
      color: #22C55E;
      font-weight: bold;
    }
    
    @media (max-width: 480px) {
      h1 {
        font-size: 24px;
      }
      
      .icon {
        font-size: 48px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">M</div>
    <div class="icon">⚡</div>
    
    <h1>Vous êtes hors ligne</h1>
    <p>Impossible de se connecter à MAATFEED. Vérifiez votre connexion internet et réessayez.</p>
    
    <button class="button" onclick="retryConnection()">
      <span>🔄</span>
      <span>Réessayer</span>
    </button>
    
    <a href="/" class="button button-secondary">
      <span>←</span>
      <span>Retour à l'accueil</span>
    </a>
    
    <div id="status" class="status hidden">
      Vérification de la connexion...
    </div>
    
    <div class="cached-content">
      <h2>📱 Contenu disponible hors ligne</h2>
      <ul class="cached-list">
        <li>Page d'accueil</li>
        <li>Articles précédemment consultés</li>
        <li>Images et icônes</li>
      </ul>
    </div>
  </div>
  
  <script>
    function retryConnection() {
      const status = document.getElementById('status');
      status.classList.remove('hidden');
      status.textContent = 'Vérification de la connexion...';
      
      // Try to fetch a small resource to check connectivity
      fetch('/favicon.ico', { method: 'HEAD', cache: 'no-store' })
        .then(() => {
          status.textContent = '✅ Connexion restaurée ! Redirection...';
          status.style.background = 'rgba(34, 197, 94, 0.1)';
          status.style.borderColor = 'rgba(34, 197, 94, 0.2)';
          status.style.color = '#22C55E';
          
          setTimeout(() => {
            window.location.href = '/';
          }, 1000);
        })
        .catch(() => {
          status.textContent = '❌ Toujours hors ligne. Vérifiez votre connexion.';
          status.style.background = 'rgba(239, 68, 68, 0.1)';
          status.style.borderColor = 'rgba(239, 68, 68, 0.2)';
          status.style.color = '#EF4444';
        });
    }
    
    // Check connection status periodically
    setInterval(() => {
      if (navigator.onLine) {
        retryConnection();
      }
    }, 5000);
  </script>
</body>
</html>
